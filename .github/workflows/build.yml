name: Build

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Java 21 feeds the 1.21.x toolchains; Java 25 (last entry = default JAVA_HOME)
      # is the Gradle JVM - loom requires that for the Minecraft 26.x targets.
      - name: Set up JDK 21 + 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build all version artifacts
        run: ./gradlew buildAllVersions --no-daemon --stacktrace

      - name: Run all tests
        run: ./gradlew testAllVersions --no-daemon --stacktrace

      # Exercise the mixin boundary and the new 26.3 launchers on real servers.
      - name: Smoke test NeoForge 1.21.5
        run: python3 scripts/smoke_neoforge.py --mc 1.21.5 --neoforge 21.5.97 --java 21 --jar 'platforms/neoforge-1.21.5/build/libs/explorersfriend-neoforge-1.21.5-*.jar'

      - name: Smoke test Fabric 26.3
        run: python3 scripts/smoke.py --module fabric-26.3 --mc 26.3 --java 25 --loader 0.19.5 --jar 'platforms/fabric-26.3/build/libs/explorersfriend-fabric-26.3-*.jar'

      - name: Smoke test NeoForge 26.3
        run: python3 scripts/smoke_neoforge.py --mc 26.3 --neoforge 26.3.0.16-beta --java 25 --jar 'platforms/neoforge-26.3/build/libs/explorersfriend-neoforge-26.3-*.jar'

      - name: Package and verify artifacts
        run: ./gradlew packageAllVersions verifyAllArtifacts --no-daemon --stacktrace

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: explorersfriend-all-versions
          path: |
            dist/*.jar
            dist/checksums-sha256.txt
            dist/release-manifest.json
            dist/compatibility.json
          if-no-files-found: error
